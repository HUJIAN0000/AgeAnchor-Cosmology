name: Verify frozen release and likelihood
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-current.txt
      - run: python RUN_REPRO.py verify
      - run: python RUN_REPRO.py validate
